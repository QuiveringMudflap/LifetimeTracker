name: Deploy ProspectDialer to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/sales-prospect-tracker-4z6e9a
    paths:
      - "caller/**"
      - ".github/workflows/deploy-caller.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload caller/ folder as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./caller

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
