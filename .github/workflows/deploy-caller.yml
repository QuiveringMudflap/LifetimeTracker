name: Deploy ProspectDialer to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/sales-prospect-tracker-4z6e9a
    paths:
      - "caller/**"
      - ".github/workflows/deploy-caller.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "pages-deploy"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Push caller/ to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./caller
          publish_branch: gh-pages
          force_orphan: true
          commit_message: "Deploy from ${{ github.sha }}"
